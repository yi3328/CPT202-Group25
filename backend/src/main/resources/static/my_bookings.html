<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-bg { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="min-h-screen relative">

    <nav class="p-8 flex justify-between items-center opacity-80">
        <div class="text-2xl font-extrabold tracking-tighter italic">SPECIALIST<span class="text-sky-400">HUB.</span></div>
        <div class="space-x-8 text-sm uppercase tracking-widest font-bold">
            <a href="specialist_search.html" class="text-slate-400 hover:text-sky-400 transition">Book New</a>
            <a href="#" class="text-sky-400 border-b-2 border-sky-400 pb-1">My Dashboard</a>
            <a href="#" onclick="localStorage.clear(); window.location.href='login.html'" class="text-red-400 hover:text-red-300 transition">Logout</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-8 py-12">
        <h1 class="text-5xl font-extrabold tracking-tight mb-4">Your <span class="text-sky-400">Appointments.</span></h1>
        <p class="text-slate-400 text-lg font-light">Manage your consultations and complete pending payments.</p>
    </header>

    <main class="max-w-7xl mx-auto px-8 pb-20">
        <div id="loading" class="text-sky-400 tracking-widest uppercase text-sm font-bold">Loading your schedule...</div>
        <div id="bookingList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden"></div>
        <div id="noBookings" class="hidden text-center py-20 border border-dashed border-slate-700 rounded-2xl">
            <p class="text-slate-500 text-xl font-light mb-6">You have no upcoming appointments.</p>
        </div>
    </main>

    <div id="paymentModal" class="fixed inset-0 modal-bg flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Secure Checkout</h2>
                <button onclick="closePaymentModal()" class="text-slate-500 hover:text-white">&times;</button>
            </div>
            
            <div class="bg-slate-800 p-4 rounded-xl mb-6">
                <p class="text-sm text-slate-400">Total Amount Due</p>
                <p class="text-3xl font-bold text-emerald-400">$150.00</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Card Number</label>
                    <input type="text" class="w-full bg-slate-800 border-none rounded-lg p-3 text-white outline-none focus:ring-1 focus:ring-sky-500" value="**** **** **** 4242" disabled>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Expiry</label>
                        <input type="text" class="w-full bg-slate-800 border-none rounded-lg p-3 text-white outline-none" value="12/28" disabled>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">CVC</label>
                        <input type="text" class="w-full bg-slate-800 border-none rounded-lg p-3 text-white outline-none" value="***" disabled>
                    </div>
                </div>
            </div>

            <input type="hidden" id="currentPayingOrderID">

            <button onclick="processPayment()" class="w-full mt-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-lg font-bold transition flex justify-center items-center">
                <span id="payBtnText">Confirm Payment</span>
            </button>
        </div>
    </div>

    <script>
        // 1. 安全拦截：检查是否已登录
        const currentCustomerID = localStorage.getItem('customerID');
        if (!currentCustomerID) {
            alert("Please log in first!");
            window.location.href = 'login.html';
        }

        async function fetchMyBookings() {
            try {
                const response = await fetch(`http://localhost:8081/api/appointments/customer/${currentCustomerID}`);
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                const list = document.getElementById('bookingList');
                list.innerHTML = '';
                
                if (data.length === 0) {
                    document.getElementById('noBookings').classList.remove('hidden');
                } else {
                    document.getElementById('noBookings').classList.add('hidden');
                    list.classList.remove('hidden');
                    
                    data.forEach(booking => {
                        const status = booking.orderStatus;
                        // 1=Unpaid, 2=Unconfirmed(paid), 3=Confirmed, 4=Completed/Overdue, 5=Cancelled
                        const isUnpaid = status === 1;
                        const isUnconfirmed = status === 2;
                        const isConfirmed = status === 3;
                        const statusText = isUnpaid ? 'UNPAID' : isUnconfirmed ? 'UNCONFIRMED' : isConfirmed ? 'CONFIRMED' : status === 4 ? 'COMPLETED' : 'CANCELLED';
                        const statusColor = isUnpaid ? 'amber' : isUnconfirmed ? 'yellow' : isConfirmed ? 'blue' : 'slate';

                        // 倒计时显示（仅未付款订单）
                        const countdownHTML = isUnpaid && booking.createdAt
                            ? `<div class="text-center text-amber-400 text-xs mt-1" id="countdown-${booking.orderID}"></div>`
                            : '';

                        const paymentUI = isUnpaid
                            ? `<button onclick="openPaymentModal(${booking.orderID})" class="w-full py-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg hover:bg-emerald-500 hover:text-slate-900 transition font-bold text-sm">Pay Now ($150)</button>`
                            : isUnconfirmed
                            ? `<div class="w-full py-2 text-center text-yellow-400 text-sm font-bold uppercase tracking-widest bg-yellow-500/10 rounded-lg">Awaiting Confirmation</div>`
                            : `<div class="w-full py-2 text-center text-slate-500 text-sm font-bold uppercase tracking-widest bg-slate-800/50 rounded-lg">Payment Complete</div>`;

                        list.innerHTML += `
                            <div class="glass-card rounded-2xl p-6 relative overflow-hidden flex flex-col justify-between">
                                <div>
                                    <div class="absolute top-0 right-0 w-2 h-full ${isUnpaid ? 'bg-amber-400' : 'bg-emerald-400'}"></div>
                                    <div class="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 class="text-xl font-bold">${booking.specialistName}</h3>
                                            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Consultation</p>
                                        </div>
                                        <span class="px-3 py-1 bg-${statusColor}-500/10 text-${statusColor}-400 text-xs rounded-full font-bold">
                                            ${statusText}
                                        </span>
                                    </div>
                                    <div class="space-y-3 text-sm text-slate-300 mt-6 mb-6 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between"><span class="text-slate-500">Date</span><span class="font-semibold text-white">${booking.date}</span></div>
                                        <div class="flex justify-between"><span class="text-slate-500">Time</span><span class="font-semibold text-white">${booking.timeSlot}</span></div>
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    ${paymentUI}
                                    ${countdownHTML}
                                    <button onclick="cancelBooking(${booking.appointmentID})" class="w-full py-2 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-500 hover:text-white transition font-bold text-sm">Cancel Booking</button>
                                </div>
                            </div>
                        `;

                        // 为未付款订单启动倒计时
                        if (isUnpaid && booking.createdAt) {
                            startCountdown(booking.orderID, booking.createdAt);
                        }
                    });
                }
            } catch (error) {
                console.error("Fetch error:", error);
            }
        }

        function openPaymentModal(orderID) {
            document.getElementById('currentPayingOrderID').value = orderID;
            const modal = document.getElementById('paymentModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closePaymentModal() {
            const modal = document.getElementById('paymentModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function processPayment() {
            const orderID = document.getElementById('currentPayingOrderID').value;
            const btnText = document.getElementById('payBtnText');
            
            btnText.innerText = "Processing...";
            
            const paymentData = {
                orderID: parseInt(orderID),
                paymentAmount: 150.00,
                paymentMethod: 1 
            };

            try {
                const response = await fetch('http://localhost:8081/api/payments/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentData)
                });

                if (response.ok) {
                    btnText.innerText = "Payment Successful!";
                    setTimeout(() => {
                        closePaymentModal();
                        fetchMyBookings(); 
                        btnText.innerText = "Confirm Payment";
                    }, 1000);
                } else {
                    alert("Payment failed.");
                    btnText.innerText = "Confirm Payment";
                }
            } catch (error) {
                alert("Connection error.");
                btnText.innerText = "Confirm Payment";
            }
        }

        async function cancelBooking(appointmentID) {
            if (!confirm("Are you sure you want to cancel this appointment?")) return;
            try {
                const response = await fetch(`http://localhost:8081/api/appointments/cancel/${appointmentID}`, { method: 'DELETE' });
                if (response.ok) {
                    document.getElementById('loading').classList.remove('hidden');
                    document.getElementById('bookingList').classList.add('hidden');
                    fetchMyBookings();
                } else {
                    alert(await response.text());
                }
            } catch (error) {
                alert("Server error.");
            }
        }

        // 倒计时功能
        function startCountdown(orderID, createdAt) {
            const countdownEl = document.getElementById(`countdown-${orderID}`);
            if (!countdownEl) return;

            const createdTime = new Date(createdAt).getTime();
            const expireTime = createdTime + 30000; // 30秒

            function updateCountdown() {
                const now = Date.now();
                const remaining = Math.max(0, expireTime - now);

                if (remaining === 0) {
                    countdownEl.innerHTML = '<span class="text-red-400 font-bold">Expired!</span>';
                    // 自动刷新页面
                    setTimeout(() => {
                        document.getElementById('loading').classList.remove('hidden');
                        document.getElementById('bookingList').classList.add('hidden');
                        fetchMyBookings();
                    }, 1000);
                    return;
                }

                const seconds = Math.ceil(remaining / 1000);
                countdownEl.innerHTML = `<span class="text-amber-400 font-bold">Auto-cancel in ${seconds}s</span>`;
                setTimeout(updateCountdown, 1000);
            }

            updateCountdown();
        }

        fetchMyBookings();
    </script>
</body>
</html>
