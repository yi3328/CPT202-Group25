<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F1217;
            color: #F8FAFC;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-10">Pending Approvals</h2>
        <div id="container" class="space-y-6"></div>
    </div>

    <script>
        const orderList = [
            {
                id: 1,
                customer: "Alice Johnson",
                timeSlot: "2025-12-20 10:00 - 10:30",
                submitTime: "2025-12-20 08:10",
                status: "Pending",
                withinTime: true
            },
            {
                id: 2,
                customer: "Bob Smith",
                timeSlot: "2025-12-20 14:00 - 14:30",
                submitTime: "2025-12-20 05:00",
                status: "Pending",
                withinTime: false
            },
            {
                id: 3,
                customer: "Charlie Brown",
                timeSlot: "2025-12-20 16:00 - 16:30",
                status: "Confirmed"
            }
        ];

        window.onload = render;

        function render() {
            const box = document.getElementById("container");
            box.innerHTML = "";

            orderList.forEach(order => {
                let btn = "";
                let msg = "";

                if (order.status === "Pending") {
                    if (order.withinTime) {
                        btn = `<button onclick="confirmOrder(${order.id})" class="px-6 py-2 bg-green-500 hover:bg-green-400 rounded-lg font-bold">Confirm Appointment</button>`;
                    } else {
                        msg = `<p class="text-red-400">Auto-cancelled: exceeded 2 hours</p >`;
                        order.status = "Auto Cancelled";
                    }
                }

                const item = `
                <div class="glass rounded-2xl p-6">
                    <p class="text-lg font-semibold">${order.customer}</p >
                    <p class="text-slate-300">${order.timeSlot}</p >
                    <p class="text-slate-400 text-sm">Submitted: ${order.submitTime || '--'}</p >
                    <p class="mt-2 font-medium text-yellow-300">Status: ${order.status}</p >
                    ${msg}
                    <div class="mt-4">${btn}</div>
                </div>`;
                box.innerHTML += item;
            });
        }

        function confirmOrder(id) {
            const target = orderList.find(o => o.id === id);
            if (target) {
                target.status = "Confirmed";
                render();
            }
        }
    </script>
</body>
</html>
