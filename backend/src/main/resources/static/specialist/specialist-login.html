<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F1217;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba255, 255, 255, 0.1;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">
    <div class="glass w-full max-w-md p-10 rounded-2xl">
        <h2 class="text-3xl font-bold text-center mb-8">Specialist Login</h2>
        <div class="mb-5">
            <label class="block text-sm text-slate-300 mb-2">Username</label>
            <input type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none">
        </div>
        <div class="mb-8">
            <label class="block text-sm text-slate-300 mb-2">Password</label>
            <input type="password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none">
        </div>
        <button onclick="window.location.href='specialist-dashboard.html'" 
        class="w-full bg-blue-500 hover:bg-blue-600 py-3 rounded-lg font-semibold transition">
            Login
        </button>
    </div>
</body>
</html>
