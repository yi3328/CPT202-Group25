<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-10 tracking-tight">Appointment Details</h2>
        <div class="glass-panel rounded-2xl p-8 space-y-6">
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Customer Name</p>
                <p class="text-xl font-semibold" id="customerName">Alice Johnson</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Date</p>
                <p class="text-lg" id="date">2025-12-19</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Time Slot</p>
                <p class="text-lg" id="timeSlot">09:00 - 09:30</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Room Number</p>
                <p class="text-lg" id="roomNumber">Room 302</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Consultation Fee</p>
                <p class="text-lg" id="fee">$80.00</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Customer Notes</p>
                <p class="text-lg bg-slate-800 p-4 rounded-lg" id="notes">I need advice on mental stress management.</p>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const appointment = {
                customerName: "Alice Johnson",
                date: "2025-12-19",
                timeSlot: "09:00 - 09:30",
                roomNumber: "Room 302",
                fee: "$80.00",
                notes: "I need advice on mental stress management."
            };

            if (!appointment.notes || appointment.notes.trim() === "") {
                appointment.notes = "No additional notes provided.";
            }

            document.getElementById("customerName").innerText = appointment.customerName;
            document.getElementById("date").innerText = appointment.date;
            document.getElementById("timeSlot").innerText = appointment.timeSlot;
            document.getElementById("roomNumber").innerText = appointment.roomNumber;
            document.getElementById("fee").innerText = appointment.fee;
            document.getElementById("notes").innerText = appointment.notes;
        };
    </script>
</body>
</html>
