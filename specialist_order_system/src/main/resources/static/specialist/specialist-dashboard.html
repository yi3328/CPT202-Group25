<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(226, 232, 240, 0.8);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .main-content{
            margin-left:240px;
            padding:40px;
        }
        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .flatpickr-calendar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .flatpickr-day { color: #1e293b; }
        .flatpickr-day:hover { background: #f1f5f9; border-color: #f1f5f9; }
        .flatpickr-day.selected { background: #0ea5e9; border-color: #0ea5e9; color: #ffffff; }
        .flatpickr-day.today { border-color: #0ea5e9; }
        .flatpickr-months .flatpickr-month, .flatpickr-current-month .flatpickr-monthDropdown-months { color: #1e293b; }
        .flatpickr-weekday { color: #64748b; }
        .flatpickr-current-month input.cur-year { color: #1e293b; }
        .flatpickr-monthDropdown-months option { background: #ffffff; color: #1e293b; }
        .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: #1e293b; }
        span.flatpickr-weekday { color: #64748b; }
        .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: #cbd5e1; }
    </style>
</head>
<body>
    <!-- Side Menu -->
    <div class="sidebar" style="background: #ffffff; border-right: 1px solid #e2e8f0; width: 240px; height: 100vh; position: fixed; padding: 30px 20px;">
        <a href="specialist-dashboard.html" id="dashboardBtn" class="flex items-center gap-2 px-4 py-3 rounded-xl text-slate-800 bg-blue-500 transition hover:bg-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Specialist Panel
        </a>

        <div class="mt-10 space-y-2">
            <div class="text-xs text-slate-400 uppercase tracking-wider mb-4">Menu</div>
            <a href="ongoing-orders.html" id="ongoingBtn" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
                Ongoing Orders
            </a>
            <a href="pending-orders.html" id="pendingBtn" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Pending Orders
            </a>
            <a href="completed-orders.html" id="completedBtn" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-blue-500 hover:text-white hover:border-blue-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Completed Orders
            </a>
        </div>

        <div class="mt-auto pt-6 border-t border-slate-200">
            <button onclick="logout()" class="btn-logout w-full">
                Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Welcome Section -->
        <div class="glass rounded-3xl p-10 mb-8">
            <h1 class="text-4xl font-bold mb-3 text-slate-800">Welcome Back, <span id="specialistName" class="text-blue-500">Specialist</span></h1>
            <p class="text-slate-500 text-lg">Here's your dashboard overview</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-3 gap-6 mb-8">
            <div class="glass rounded-2xl p-6 text-center">
                <div class="text-4xl font-bold text-blue-500 mb-2" id="totalCount">0</div>
                <div class="text-slate-500 text-sm">Total Appointments</div>
            </div>
            <div class="glass rounded-2xl p-6 text-center">
                <div class="text-4xl font-bold text-yellow-500 mb-2" id="pendingCount">0</div>
                <div class="text-slate-500 text-sm">Pending</div>
            </div>
            <div class="glass rounded-2xl p-6 text-center">
                <div class="text-4xl font-bold text-green-500 mb-2" id="completedCount">0</div>
                <div class="text-slate-500 text-sm">Completed</div>
            </div>
        </div>

        <!-- Add Time Slot Card -->
        <div class="glass rounded-3xl p-8 mb-8">
            <h2 class="text-xl font-semibold mb-6 text-slate-800">Add Time Slot</h2>
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Date</label>
                    <input type="text" id="slotDate" class="w-full bg-slate-100 border-2 border-slate-200 rounded-lg p-3 text-slate-700 outline-none focus:ring-2 focus:ring-blue-400" readonly>
                </div>
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Time Slot</label>
                    <select id="slotTime" class="w-full bg-slate-100 border-2 border-slate-200 rounded-lg p-3 text-slate-700 outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="">Select Time</option>
                        <option value="09:00-09:30">09:00-09:30</option>
                        <option value="09:30-10:00">09:30-10:00</option>
                        <option value="10:00-10:30">10:00-10:30</option>
                        <option value="10:30-11:00">10:30-11:00</option>
                        <option value="11:00-11:30">11:00-11:30</option>
                        <option value="11:30-12:00">11:30-12:00</option>
                        <option value="13:00-13:30">13:00-13:30</option>
                        <option value="13:30-14:00">13:30-14:00</option>
                        <option value="14:00-14:30">14:00-14:30</option>
                        <option value="14:30-15:00">14:30-15:00</option>
                        <option value="15:00-15:30">15:00-15:30</option>
                        <option value="15:30-16:00">15:30-16:00</option>
                        <option value="16:00-16:30">16:00-16:30</option>
                        <option value="16:30-17:00">16:30-17:00</option>
                        <option value="17:00-17:30">17:00-17:30</option>
                        <option value="17:30-18:00">17:30-18:00</option>
                    </select>
                </div>
                <button onclick="addTimeSlot()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-lg transition">Add Slot</button>
            </div>
            <div id="addMsg" class="mt-4 text-sm hidden"></div>
        </div>

        <!-- My Time Slots Card -->
        <div id="mySlotsCard" class="glass rounded-3xl p-8 mb-8 hidden">
            <h2 class="text-xl font-semibold mb-6 text-slate-800">My Time Slots</h2>
            <div id="loadingSlots" class="text-center text-slate-400 py-6">Loading...</div>
            <div id="emptySlots" class="hidden text-center text-slate-400 py-6">
                <p class="text-lg text-slate-600 mb-1">No time slots</p>
                <p class="text-slate-500 text-sm">Add your available time slots above</p>
            </div>
            <div id="slotList" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/specialists';
        const specialist = JSON.parse(sessionStorage.getItem('specialist') || 'null');

        if (!specialist) {
            window.location.href = 'specialist-login.html';
        } else {
            document.getElementById('specialistName').textContent = specialist.specialistName || 'Specialist';
            loadStats();
            loadMySlots();
        }

        // Initialize flatpickr for date picker
        flatpickr("#slotDate", {
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "Y/m/d",
            allowInput: true,
            locale: {
                firstDayOfWeek: 1,
                weekdays: {
                    shorthand: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
                    longhand: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
                },
                months: {
                    shorthand: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                    longhand: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
                }
            },
            disableMobile: true
        });

        async function loadMySlots() {
            try {
                const response = await fetch(`${API_BASE}/${specialist.specialistID}/my-availabilities?_=${Date.now()}`, { cache: 'no-cache' });
                const slots = await response.json();
                if (slots.length === 0) {
                    return;
                }

                
                document.getElementById('mySlotsCard').classList.remove('hidden');
                document.getElementById('loadingSlots').style.display = 'none';
                document.getElementById('emptySlots').classList.add('hidden');

                const container = document.getElementById('slotList');
                container.innerHTML = '';

                slots.forEach(slot => {
                    let statusClass, statusText;
                    if (slot.isBooked === 0) {
                        statusClass = 'bg-emerald-100 text-emerald-600';
                        statusText = 'Available';
                    } else if (slot.isBooked === 1) {
                        statusClass = 'bg-red-100 text-red-500';
                        statusText = 'Booked';
                    } else {
                        statusClass = 'bg-yellow-100 text-yellow-600';
                        statusText = 'Unavailable';
                    }

                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-50 rounded-xl p-4">
                            <div class="flex items-center gap-4">
                                <div>
                                    <p class="text-slate-700 font-medium">${slot.date}</p>
                                    <p class="text-slate-500 text-sm">${slot.timeSlot}</p>
                                </div>
                                <span class="px-2 py-1 ${statusClass} text-xs rounded-full font-medium">${statusText}</span>
                            </div>
                            <button onclick="deleteSlot(${slot.availabilityID})" class="px-3 py-1 bg-red-100 text-red-500 hover:bg-red-500 hover:text-white rounded-lg text-sm font-medium transition">
                                Delete
                            </button>
                        </div>`;
                });
            } catch (e) {
                
            }
        }

        async function deleteSlot(availabilityID) {
            if (!confirm('Are you sure you want to delete this time slot?')) return;

            try {
                const response = await fetch(`${API_BASE}/${specialist.specialistID}/availability/${availabilityID}`, { method: 'DELETE' });
                if (response.ok) {
                    loadMySlots();
                } else {
                    const err = await response.text();
                    alert('Failed: ' + err);
                }
            } catch (e) {
                alert('Connection error');
            }
        }

        async function loadStats() {
            try {
                const [pendingRes, confirmedRes, completedRes] = await Promise.all([
                    fetch(`${API_BASE}/${specialist.specialistID}/search?status=Unconfirmed&_=${Date.now()}`, { cache: 'no-cache' }),
                    fetch(`${API_BASE}/${specialist.specialistID}/search?status=Confirmed&_=${Date.now()}`, { cache: 'no-cache' }),
                    fetch(`${API_BASE}/${specialist.specialistID}/search?status=Completed&_=${Date.now()}`, { cache: 'no-cache' })
                ]);

                const pending = await pendingRes.json();
                const confirmed = await confirmedRes.json();
                const completed = await completedRes.json();

                document.getElementById('pendingCount').textContent = pending.length;
                document.getElementById('completedCount').textContent = completed.length;
                document.getElementById('totalCount').textContent = confirmed.length + completed.length;
            } catch (e) {
                console.error('Failed to load stats', e);
            }
        }

        async function addTimeSlot() {
            const date = document.getElementById('slotDate').value;
            const timeSlot = document.getElementById('slotTime').value;
            const msgEl = document.getElementById('addMsg');

            if (!date || !timeSlot) {
                msgEl.textContent = 'Please select both date and time slot';
                msgEl.className = 'mt-4 text-sm text-red-500';
                msgEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${specialist.specialistID}/availability`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, timeSlot })
                });

                const text = await response.text();
                if (response.ok) {
                    msgEl.textContent = 'Time slot added successfully!';
                    msgEl.className = 'mt-4 text-sm text-green-500';
                    msgEl.classList.remove('hidden');
                    document.getElementById('slotDate').value = '';
                    document.getElementById('slotTime').value = '';
                    loadStats();
                    loadMySlots();
                } else {
                    msgEl.textContent = text;
                    msgEl.className = 'mt-4 text-sm text-red-500';
                    msgEl.classList.remove('hidden');
                }
            } catch (e) {
                msgEl.textContent = 'Connection error';
                msgEl.className = 'mt-4 text-sm text-red-500';
                msgEl.classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('specialist');
            window.location.href = 'specialist-login.html';
        }

        // Highlight dashboard button since we're on dashboard page
        document.getElementById('dashboardBtn').classList.add('bg-blue-500');
    </script>
</body>
</html>
