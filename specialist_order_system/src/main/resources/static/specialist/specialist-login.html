<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: url('../specialistbackground.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-800">
    <div class="glass w-full max-w-md p-10 rounded-2xl">
        <h2 class="text-3xl font-bold text-center mb-8">Specialist Login</h2>
        <div class="mb-5">
            <label class="block text-sm text-slate-600 mb-2">Username</label>
            <input id="username" type="text" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none text-white">
        </div>
        <div class="mb-8">
            <label class="block text-sm text-slate-600 mb-2">Password</label>
            <input id="password" type="password" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none text-white">
        </div>
        <button onclick="specialistLogin()" class="w-full bg-blue-500 hover:bg-blue-600 py-3 rounded-lg font-semibold transition">
            Login
        </button>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/specialists';

        async function specialistLogin() {
            const number = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!number || !password) {
                alert('Please enter username and password');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        specialistNumber: number,
                        specialistPassword: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem('specialist', JSON.stringify(data));
                    window.location.href = 'specialist-dashboard.html';
                } else {
                    const data = await response.json();
                    alert(data.message || 'Login failed');
                }
            } catch (e) {
                alert('Connection error. Please try again.');
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') specialistLogin();
        });
    </script>
</body>
</html>
