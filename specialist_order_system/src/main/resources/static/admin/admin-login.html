<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f2744 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex items-center justify-center">
    <div class="glass w-full max-w-md p-10 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Admin Panel</h1>
            <p class="text-slate-500 text-sm">Specialist Hub Management System</p>
        </div>
        <div class="mb-5">
            <label class="block text-sm text-slate-600 mb-2">Admin Number</label>
            <input id="username" type="text" class="w-full bg-slate-100 border-2 border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-slate-700" placeholder="Enter admin number">
        </div>
        <div class="mb-8">
            <label class="block text-sm text-slate-600 mb-2">Password</label>
            <input id="password" type="password" class="w-full bg-slate-100 border-2 border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-slate-700" placeholder="Enter password">
        </div>
        <button onclick="adminLogin()" class="w-full bg-blue-500 hover:bg-blue-600 py-3 rounded-lg font-semibold transition text-white">
            Login
        </button>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/admin';

        async function adminLogin() {
            const number = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!number || !password) {
                alert('Please enter admin number and password');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminNumber: number,
                        adminPassword: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem('admin', JSON.stringify(data));
                    window.location.href = 'admin-dashboard.html';
                } else {
                    alert('Invalid admin credentials');
                }
            } catch (e) {
                alert('Connection error. Please try again.');
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') adminLogin();
        });
    </script>
</body>
</html>
