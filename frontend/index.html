<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .circle-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .circle-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }
        .specialist-btn {
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            border: 3px solid rgba(255,255,255,0.2);
        }
        .specialist-btn:hover {
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }
        .user-btn {
            background: linear-gradient(135deg, #10B981 0%, #047857 100%);
            border: 3px solid rgba(255,255,255,0.2);
        }
        .user-btn:hover {
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-8">
    <!-- Logo -->
    <div class="text-center mb-16">
        <h1 class="text-5xl font-extrabold tracking-tighter italic mb-2">
            SPECIALIST<span class="text-sky-400">HUB.</span>
        </h1>
        <p class="text-slate-400 text-lg">Professional Consultation Platform</p>
    </div>

    <!-- Two Circle Buttons -->
    <div class="flex gap-16 flex-wrap justify-center">
        <!-- Specialist -->
        <div class="text-center">
            <div class="specialist-btn circle-btn" onclick="goToSpecialist()">
                <svg class="w-12 h-12 mb-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-white text-xl font-bold">SPECIALIST</span>
                <span class="text-white/70 text-sm mt-1">Login / Register</span>
            </div>
            <p class="text-slate-400 mt-6 text-sm">Are you a specialist?</p>
        </div>

        <!-- User / Customer -->
        <div class="text-center">
            <div class="user-btn circle-btn" onclick="goToUser()">
                <svg class="w-12 h-12 mb-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span class="text-white text-xl font-bold">USER</span>
                <span class="text-white/70 text-sm mt-1">Login / Register</span>
            </div>
            <p class="text-slate-400 mt-6 text-sm">Are you a customer?</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="absolute bottom-8 text-center">
        <p class="text-slate-500 text-sm">© 2026 Specialist Hub. All rights reserved.</p>
    </div>

    <script>
        function goToSpecialist() {
            window.location.href = 'specialist/specialist-login.html';
        }

        function goToUser() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
