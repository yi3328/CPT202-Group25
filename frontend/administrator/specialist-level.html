<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist Rules | Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background-color:#0F172A;color:#F8FAFC;}
        .glass-panel{background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="glass-panel rounded-xl p-6 max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold">Specialist Level & Billing Rules</h1>
            <button class="px-4 py-2 bg-blue-600 rounded">Save Changes</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="glass-panel rounded-lg p-5">
                <h2 class="text-lg font-medium mb-4">Specialist Level Settings</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block mb-2 text-sm">Level Name</label>
                        <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="Junior Specialist">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">Level Name</label>
                        <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="Senior Specialist">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">Level Name</label>
                        <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="Expert Specialist">
                    </div>
                </div>
            </div>
            <div class="glass-panel rounded-lg p-5">
                <h2 class="text-lg font-medium mb-4">Billing Rules</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block mb-2 text-sm">Hourly Rate (USD)</label>
                        <input type="number" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="50">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">Hourly Rate (USD)</label>
                        <input type="number" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="100">
                    </div>
                    <div>
                        <label class="block mb-2 text-sm">Hourly Rate (USD)</label>
                        <input type="number" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="180">
                    </div>
                </div>
            </div>
        </div>
        <div class="glass-panel rounded-lg p-5">
            <h2 class="text-lg font-medium mb-4">Rule Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block mb-2 text-sm">Appointment Cancellation Fee</label>
                    <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="10%">
                </div>
                <div>
                    <label class="block mb-2 text-sm">Overtime Charging Rate</label>
                    <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="1.5x">
                </div>
                <div>
                    <label class="block mb-2 text-sm">Discount Threshold</label>
                    <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="5 Bookings">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
