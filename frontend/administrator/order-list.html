<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List | Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background-color:#0F172A;color:#F8FAFC;}
        .glass-panel{background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="glass-panel rounded-xl p-6 max-w-6xl mx-auto">
        <h1 class="text-2xl font-semibold mb-6">Order List</h1>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="border-b border-white/10">
                        <th class="pb-4 pr-4">Order ID</th>
                        <th class="pb-4 pr-4">Customer</th>
                        <th class="pb-4 pr-4">Specialist</th>
                        <th class="pb-4 pr-4">Fee</th>
                        <th class="pb-4 pr-4">Status</th>
                        <th class="pb-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-white/10 hover:bg-white/5">
                        <td class="py-4 pr-4">ORDER001</td>
                        <td class="py-4 pr-4">John Doe</td>
                        <td class="py-4 pr-4">Jane Smith</td>
                        <td class="py-4 pr-4">$100.00</td>
                        <td class="py-4 pr-4">Completed</td>
                        <td class="py-4 flex gap-2">
                            <button class="px-3 py-1 bg-blue-600 rounded text-sm">Detail</button>
                        </td>
                    </tr>
                    <tr class="border-b border-white/10 hover:bg-white/5">
                        <td class="py-4 pr-4">ORDER002</td>
                        <td class="py-4 pr-4">Alice Brown</td>
                        <td class="py-4 pr-4">Mike Lee</td>
                        <td class="py-4 pr-4">$80.00</td>
                        <td class="py-4 pr-4">Pending</td>
                        <td class="py-4 flex gap-2">
                            <button class="px-3 py-1 bg-blue-600 rounded text-sm">Detail</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-white/5">
                        <td class="py-4 pr-4">ORDER003</td>
                        <td class="py-4 pr-4">Tom Clark</td>
                        <td class="py-4 pr-4">Lisa Wang</td>
                        <td class="py-4 pr-4">$150.00</td>
                        <td class="py-4 pr-4">Confirmed</td>
                        <td class="py-4 flex gap-2">
                            <button class="px-3 py-1 bg-blue-600 rounded text-sm">Detail</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
