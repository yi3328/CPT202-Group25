<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Edit | Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background-color:#0F172A;color:#F8FAFC;}
        .glass-panel{background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="glass-panel rounded-xl p-6 max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold">User Edit</h1>
            <div class="flex gap-3">
                <button class="px-4 py-2 bg-green-600 rounded">Save</button>
                <button class="px-4 py-2 bg-gray-600 rounded">Cancel</button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block mb-2 text-sm">User ID</label>
                <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="1001">
            </div>
            <div>
                <label class="block mb-2 text-sm">User Number</label>
                <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="CUST001">
            </div>
            <div>
                <label class="block mb-2 text-sm">User Name</label>
                <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="John Doe">
            </div>
            <div>
                <label class="block mb-2 text-sm">User Type</label>
                <select class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700">
                    <option>Customer</option>
                    <option selected>Specialist</option>
                    <option>Administrator</option>
                </select>
            </div>
            <div>
                <label class="block mb-2 text-sm">Email</label>
                <input type="email" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="john@example.com">
            </div>
            <div>
                <label class="block mb-2 text-sm">Phone</label>
                <input type="text" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="123456789">
            </div>
            <div>
                <label class="block mb-2 text-sm">Status</label>
                <select class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700">
                    <option selected>Active</option>
                    <option>Disabled</option>
                </select>
            </div>
            <div>
                <label class="block mb-2 text-sm">Password</label>
                <input type="password" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="password123">
            </div>
        </div>
        <div class="glass-panel rounded-lg p-5">
            <h2 class="text-lg font-medium mb-4">Additional Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block mb-2 text-sm">Register Time</label>
                    <input type="datetime-local" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="2025-01-01T09:00">
                </div>
                <div>
                    <label class="block mb-2 text-sm">Last Login</label>
                    <input type="datetime-local" class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700" value="2025-04-28T15:30">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
