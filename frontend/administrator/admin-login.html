<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background-color:#0F172A;color:#F8FAFC;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
        .glass-panel{background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}
    </style>
</head>
<body>
    <div class="glass-panel rounded-xl p-8 w-full max-w-md">
        <h1 class="text-2xl font-semibold text-center mb-6">Admin Login</h1>
        <div class="space-y-4">
            <div>
                <label class="block mb-2 text-sm">Username</label>
                <input type="text" class="w-full px-4 py-2 bg-slate-800 rounded border border-slate-700">
            </div>
            <div>
                <label class="block mb-2 text-sm">Password</label>
                <input type="password" class="w-full px-4 py-2 bg-slate-800 rounded border border-slate-700">
            </div>
            <button class="w-full px-4 py-2 bg-blue-600 rounded mt-2">Login</button>
        </div>
    </div>
</body>
</html>
