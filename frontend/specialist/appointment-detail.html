<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center mb-8">
            <button onclick="window.history.back()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg mr-4">← Back</button>
            <h2 class="text-3xl font-extrabold tracking-tight">Appointment Details</h2>
        </div>
        <div id="loading" class="text-center text-slate-400 py-20">Loading...</div>
        <div id="content" class="hidden glass-panel rounded-2xl p-8 space-y-6">
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Customer Name</p>
                <p class="text-xl font-semibold" id="customerName">-</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Date</p>
                <p class="text-lg" id="date">-</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Time Slot</p>
                <p class="text-lg" id="timeSlot">-</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Room Number</p>
                <p class="text-lg" id="roomNumber">-</p>
            </div>
            <div>
                <p class="text-xs uppercase text-slate-500 mb-1">Order Status</p>
                <p class="text-lg" id="orderStatus">-</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/specialists';
        const specialist = JSON.parse(sessionStorage.getItem('specialist') || 'null');

        if (!specialist) {
            window.location.href = 'specialist-login.html';
        } else {
            loadDetail();
        }

        async function loadDetail() {
            const appointmentID = sessionStorage.getItem('currentAppointmentID');
            if (!appointmentID) {
                document.getElementById('loading').textContent = 'No appointment selected';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${specialist.specialistID}/appointments/${appointmentID}`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');

                    document.getElementById('customerName').innerText = data.customerName || '-';
                    document.getElementById('date').innerText = data.date || '-';
                    document.getElementById('timeSlot').innerText = data.timeSlot || '-';
                    document.getElementById('roomNumber').innerText = data.roomNumber || 'TBD';
                    document.getElementById('orderStatus').innerText = data.orderStatus || '-';
                } else {
                    document.getElementById('loading').textContent = 'Failed to load details';
                }
            } catch (e) {
                document.getElementById('loading').textContent = 'Connection error';
            }
        }
    </script>
</body>
</html>
