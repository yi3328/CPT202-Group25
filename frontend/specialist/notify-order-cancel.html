<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Cancellation Notification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F1217;
            color: #F8FAFC;
        }
        .glass-card {
            background: rgba30, 41, 59, 0.7;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold mb-8">Order Cancellation Reminder</h2>
        <div class="glass-card rounded-xl p-5">
            <h4 class="font-semibold text-lg text-red-400">Booking Cancelled</h4>
            <p class="text-slate-300 mt-3">
                The customer has voluntarily cancelled their pending consultation order.
                Please update your appointment schedule in time.
            </p >
            <p class="text-xs text-slate-400 mt-4">Notification Time: 2026-04-27 11:22</p >
        </div>
    </div>
</body>
</html>
