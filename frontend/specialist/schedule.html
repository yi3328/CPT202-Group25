<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F1217;
            color: #F8FAFC;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .appointment-item {
            cursor: pointer;
            transition: 0.2s;
        }
        .appointment-item:hover {
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-10">My Schedule</h2>
        <div class="space-y-4" id="scheduleList">
            <!-- Reservation 1: Click to jump to details -->
            <div class="glass rounded-xl p-6 appointment-item" onclick="goToDetail()">
                <p class="font-semibold text-lg">Alice Johnson</p >
                <p class="text-slate-300">2025-12-20 10:00 - 10:30</p >
                <p class="text-sm text-blue-400 mt-2">Click to view appointment details</p >
            </div>

            <div class="glass rounded-xl p-6 appointment-item" onclick="goToDetail()">
                <p class="font-semibold text-lg">Bob Smith</p >
                <p class="text-slate-300">2025-12-20 14:00 - 14:30</p >
                <p class="text-sm text-blue-400 mt-2">Click to view appointment details</p >
            </div>
        </div>
    </div>

    <script>
        function goToDetail() {
            window.location.href = "appointment-detail.html";
        }
    </script>
</body>
</html>
