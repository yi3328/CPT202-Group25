<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0F172A; 
            color: #F8FAFC; 
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-10 tracking-tight">My Daily Schedule</h2>

        <div class="mb-10">
            <label class="block text-xs uppercase tracking-widest text-slate-500 mb-3">Select Date</label>
            <input type="date" id="selectDate" class="bg-slate-800 border-none rounded-lg p-3 text-white outline-none focus:ring-1 focus:ring-sky-500">
        </div>

        <div id="scheduleContainer" class="space-y-5"></div>
    </div>

    <script>
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("selectDate").value = today;
            loadScheduleData();
        };

        document.getElementById("selectDate").addEventListener("change", function() {
            loadScheduleData();
        });

        async function loadScheduleData() {
            const chosenDate = document.getElementById("selectDate").value;
            const container = document.getElementById("scheduleContainer");
            container.innerHTML = "";

            const appointmentList = [
                { customerName: "Alice Johnson", timeSlot: "09:00 - 09:30", status: "Confirmed" },
                { customerName: "Bob Smith", timeSlot: "10:00 - 10:30", status: "Pending" }
            ];

            if (appointmentList.length === 0) {
                container.innerHTML = `
                    <div class="glass-panel rounded-2xl p-10 text-center">
                        <p class="text-slate-400">You have no appointments scheduled for today.</p>
                    </div>
                `;
                return;
            }

            appointmentList.forEach(item => {
                container.innerHTML += `
                    <div class="glass-panel rounded-2xl p-6">
                        <p class="text-slate-300 mb-2"><strong>Customer:</strong> ${item.customerName}</p>
                        <p class="text-slate-300 mb-2"><strong>Time:</strong> ${item.timeSlot}</p>
                        <p class="text-slate-300"><strong>Status:</strong> ${item.status}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
