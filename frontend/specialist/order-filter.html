<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Filter | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-8 tracking-tight">Order Search & Filter</h2>
        
        <div class="glass-panel rounded-2xl p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <p class="text-xs text-slate-500 mb-2">Search Customer</p>
                    <input id="searchName" type="text" placeholder="Name..." class="w-full bg-slate-800 rounded-lg p-3 text-white border-0 outline-none focus:ring-sky-500">
                </div>
                <div>
                    <p class="text-xs text-slate-500 mb-2">Filter Status</p>
                    <select id="filterStatus" class="w-full bg-slate-800 rounded-lg p-3 text-white border-0 outline-none focus:ring-sky-500">
                        <option value="all">All</option>
                        <option value="Pending">Pending</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="flex gap-3 items-end">
                    <button onclick="applyFilter()" class="flex-1 bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold py-3 px-4 rounded-lg transition">Search</button>
                    <button onclick="clearFilter()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-lg transition">Clear</button>
                </div>
            </div>
        </div>

        <div id="resultContainer" class="space-y-4"></div>
    </div>

    <script>
        const orderList = [
            { id: 1, customerName: "Alice Johnson", status: "Confirmed", date: "2025-12-19", timeSlot: "09:00 - 09:30" },
            { id: 2, customerName: "Bob Smith", status: "Completed", date: "2025-12-18", timeSlot: "10:00 - 10:30" },
            { id: 3, customerName: "Charlie Brown", status: "Pending", date: "2025-12-20", timeSlot: "14:00 - 14:30" },
            { id: 4, customerName: "Alice Johnson", status: "Completed", date: "2025-12-17", timeSlot: "11:00 - 11:30" },
            { id: 5, customerName: "Diana Prince", status: "Confirmed", date: "2025-12-19", timeSlot: "16:00 - 16:30" }
        ];

        window.onload = function() {
            renderList(orderList);
        };

        function renderList(items) {
            const container = document.getElementById("resultContainer");
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = `<div class="glass-panel rounded-xl p-8 text-center"><p class="text-slate-400">No matching records found.</p></div>`;
                return;
            }

            items.forEach(item => {
                container.innerHTML += `
                <div class="glass-panel rounded-xl p-5">
                    <p class="text-slate-300 mb-1"><strong>Customer:</strong> ${item.customerName}</p>
                    <p class="text-slate-300 mb-1"><strong>Date:</strong> ${item.date}</p>
                    <p class="text-slate-300 mb-1"><strong>Time:</strong> ${item.timeSlot}</p>
                    <p class="text-slate-300"><strong>Status:</strong> ${item.status}</p>
                </div>`;
            });
        }

        function applyFilter() {
            const name = document.getElementById("searchName").value.toLowerCase().trim();
            const status = document.getElementById("filterStatus").value;

            let filtered = orderList.filter(item => {
                const matchName = item.customerName.toLowerCase().includes(name);
                const matchStatus = status === "all" || item.status === status;
                return matchName && matchStatus;
            });

            renderList(filtered);
        }

        function clearFilter() {
            document.getElementById("searchName").value = "";
            document.getElementById("filterStatus").value = "all";
            renderList(orderList);
        }
    </script>
</body>
</html>
