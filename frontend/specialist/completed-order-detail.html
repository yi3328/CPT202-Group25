<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F1217;
            color: #F8FAFC;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen p-10">
    <div class="max-w-5xl mx-auto">
        <h2 class="text-3xl font-extrabold mb-10">Customer Feedback</h2>

        <div id="loading" class="text-center text-slate-400 py-10">Loading...</div>
        <div id="emptyMsg" class="hidden text-center text-slate-400 py-10">No feedback yet.</div>
        <div id="feedbackList" class="space-y-6"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/feedbacks';
        const specialist = JSON.parse(sessionStorage.getItem('specialist') || 'null');

        if (!specialist) {
            window.location.href = 'specialist-login.html';
        } else {
            loadFeedback();
        }

        async function loadFeedback() {
            try {
                const response = await fetch(`${API_BASE}/specialist/${specialist.specialistID}`);
                const feedbacks = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (feedbacks.length === 0) {
                    document.getElementById('emptyMsg').classList.remove('hidden');
                    return;
                }

                const container = document.getElementById('feedbackList');
                feedbacks.forEach(fb => {
                    const stars = '★'.repeat(fb.rating) + '☆'.repeat(5 - fb.rating);
                    const div = document.createElement('div');
                    div.className = 'glass rounded-2xl p-8';
                    div.innerHTML = `
                        <div class="grid grid-cols-2 gap-6 mb-6">
                            <div>
                                <p class="text-xs uppercase text-slate-500 mb-1">Customer Name</p>
                                <p class="text-xl font-semibold">${fb.customerName || 'Unknown'}</p>
                            </div>
                            <div>
                                <p class="text-xs uppercase text-slate-500 mb-1">Appointment Time</p>
                                <p>${fb.date} ${fb.timeSlot || ''}</p>
                            </div>
                            <div>
                                <p class="text-xs uppercase text-slate-500 mb-1">Room</p>
                                <p>${fb.roomNumber || 'TBD'}</p>
                            </div>
                            <div>
                                <p class="text-xs uppercase text-slate-500 mb-1">Customer Rating</p>
                                <p class="text-yellow-400 text-xl">${stars}</p>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs uppercase text-slate-500 mb-1">Customer Feedback</p>
                            <p class="bg-slate-800 p-4 rounded-lg mt-2">${fb.comment || 'No comment provided.'}</p>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                document.getElementById('loading').textContent = 'Failed to load feedback';
            }
        }
    </script>
</body>
</html>
