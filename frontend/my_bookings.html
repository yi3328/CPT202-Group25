<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Specialist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; padding: 1.5rem; }
        .modal-bg { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; }
    </style>
</head>
<body class="min-h-screen relative">

    <nav class="p-8 flex justify-between items-center opacity-80">
        <div class="text-2xl font-extrabold tracking-tighter italic">SPECIALIST<span class="text-sky-400">HUB.</span></div>
        <div class="space-x-8 text-sm uppercase tracking-widest font-bold">
            <a href="specialist_search.html" class="text-slate-400 hover:text-sky-400 transition">Book New</a>
            <a href="#" class="text-sky-400 border-b-2 border-sky-400 pb-1">My Dashboard</a>
            <a href="#" onclick="localStorage.clear(); window.location.href='login.html'" class="text-red-400 hover:text-red-300 transition">Logout</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-8 py-12">
        <h1 class="text-5xl font-extrabold tracking-tight mb-4">Your <span class="text-sky-400">Appointments.</span></h1>
        <p class="text-slate-400 text-lg font-light">Manage your consultations and complete pending payments.</p>
    </header>

    <main class="max-w-7xl mx-auto px-8 pb-20">
        <div id="loading" class="text-sky-400 tracking-widest uppercase text-sm font-bold">Loading your schedule...</div>
        <div id="bookingList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden"></div>
        <div id="noBookings" class="hidden text-center py-20 border border-dashed border-slate-700 rounded-2xl">
            <p class="text-slate-500 text-xl font-light mb-6">You have no upcoming appointments.</p>
        </div>
    </main>

    <div id="feedbackModal" class="fixed inset-0 modal-bg hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6">Leave Feedback</h2>

            <div class="mb-6">
                <p class="text-sm text-slate-400 mb-3">Your Rating</p>
                <div class="flex gap-2" id="starRating">
                    <button onclick="setRating(1)" class="text-3xl text-slate-600 hover:text-amber-400 transition">★</button>
                    <button onclick="setRating(2)" class="text-3xl text-slate-600 hover:text-amber-400 transition">★</button>
                    <button onclick="setRating(3)" class="text-3xl text-slate-600 hover:text-amber-400 transition">★</button>
                    <button onclick="setRating(4)" class="text-3xl text-slate-600 hover:text-amber-400 transition">★</button>
                    <button onclick="setRating(5)" class="text-3xl text-slate-600 hover:text-amber-400 transition">★</button>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Comment (Optional)</label>
                <textarea id="feedbackComment" rows="4" class="w-full bg-slate-800 border-none rounded-lg p-3 text-white outline-none resize-none" placeholder="Share your experience..."></textarea>
            </div>

            <input type="hidden" id="feedbackOrderID">
            <input type="hidden" id="feedbackSpecialistID">
            <input type="hidden" id="currentRating" value="0">

            <button onclick="submitFeedback()" class="w-full py-4 bg-sky-500 hover:bg-sky-400 text-slate-900 rounded-lg font-bold transition">Submit Feedback</button>
            <button onclick="closeFeedbackModal()" class="w-full py-2 mt-2 text-slate-400 hover:text-white">Cancel</button>
        </div>
    </div>

    <script>
        const currentCustomerID = localStorage.getItem('customerID');
        if (!currentCustomerID) {
            window.location.href = 'login.html';
        }

        async function fetchMyBookings() {
            try {
                const response = await fetch('http://localhost:8081/api/appointments/customer/' + currentCustomerID);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                const list = document.getElementById('bookingList');
                list.innerHTML = '';

                if (data.length === 0) {
                    document.getElementById('noBookings').classList.remove('hidden');
                    return;
                }

                document.getElementById('noBookings').classList.add('hidden');
                list.classList.remove('hidden');

                for (let i = 0; i < data.length; i++) {
                    const booking = data[i];
                    const status = booking.orderStatus;

                    let statusText = 'UNKNOWN';
                    let statusColor = 'slate';
                    if (status === 1) { statusText = 'UNPAID'; statusColor = 'amber'; }
                    else if (status === 2) { statusText = 'UNCONFIRMED'; statusColor = 'yellow'; }
                    else if (status === 3) { statusText = 'CONFIRMED'; statusColor = 'blue'; }
                    else if (status === 4) { statusText = 'COMPLETED'; statusColor = 'green'; }
                    else if (status === 5) { statusText = 'CANCELLED'; statusColor = 'slate'; }

                    let actionBtn = '';
                    if (status === 4) {
                        actionBtn = '<button onclick="openFeedbackModal(' + booking.orderID + ',' + booking.specialistID + ')" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-900 rounded-lg font-bold">Leave Feedback</button>';
                    } else if (status === 1) {
                        actionBtn = '<div class="w-full py-3 bg-emerald-500/20 text-emerald-400 rounded-lg font-bold text-center">Pay Now ($150)</div>';
                    } else if (status === 2) {
                        actionBtn = '<div class="w-full py-3 text-center text-yellow-400 font-bold bg-yellow-500/20 rounded-lg">Awaiting Confirmation</div>';
                    } else {
                        actionBtn = '<div class="w-full py-3 text-center text-slate-500 font-bold bg-slate-800 rounded-lg">Payment Complete</div>';
                    }

                    const html = '<div class="glass-card rounded-2xl p-6">' +
                        '<div class="flex justify-between items-start mb-4">' +
                        '<div><h3 class="text-xl font-bold">' + booking.specialistName + '</h3>' +
                        '<p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Consultation</p></div>' +
                        '<span class="px-3 py-1 bg-' + statusColor + '-500/10 text-' + statusColor + '-400 text-xs rounded-full font-bold">' + statusText + '</span>' +
                        '</div>' +
                        '<div class="bg-slate-800/50 p-4 rounded-xl mb-4">' +
                        '<div class="flex justify-between"><span class="text-slate-500">Date</span><span class="font-semibold">' + booking.date + '</span></div>' +
                        '<div class="flex justify-between"><span class="text-slate-500">Time</span><span class="font-semibold">' + booking.timeSlot + '</span></div>' +
                        '</div>' +
                        actionBtn +
                        '</div>';

                    list.innerHTML += html;
                }
            } catch (e) {
                document.getElementById('loading').textContent = 'Error loading bookings';
            }
        }

        function openFeedbackModal(orderID, specialistID) {
            document.getElementById('feedbackOrderID').value = orderID;
            document.getElementById('feedbackSpecialistID').value = specialistID;
            document.getElementById('currentRating').value = 0;
            document.getElementById('feedbackComment').value = '';
            updateStars(0);
            document.getElementById('feedbackModal').classList.remove('hidden');
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.add('hidden');
        }

        function setRating(rating) {
            document.getElementById('currentRating').value = rating;
            updateStars(rating);
        }

        function updateStars(rating) {
            const stars = document.querySelectorAll('#starRating button');
            for (let i = 0; i < stars.length; i++) {
                stars[i].style.color = (i < rating) ? '#fbbf24' : '#475569';
            }
        }

        async function submitFeedback() {
            const rating = parseInt(document.getElementById('currentRating').value);
            if (rating === 0) {
                alert('Please select a rating');
                return;
            }

            const feedbackData = {
                orderID: parseInt(document.getElementById('feedbackOrderID').value),
                specialistID: parseInt(document.getElementById('feedbackSpecialistID').value),
                customerID: parseInt(currentCustomerID),
                rating: rating,
                comment: document.getElementById('feedbackComment').value
            };

            try {
                const response = await fetch('http://localhost:8081/api/feedbacks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(feedbackData)
                });

                if (response.ok) {
                    closeFeedbackModal();
                    alert('Thank you for your feedback!');
                } else {
                    const text = await response.text();
                    alert(text);
                }
            } catch (e) {
                alert('Connection error');
            }
        }

        fetchMyBookings();
    </script>
</body>
</html>
